[pytest]
# 只扫 tests/，避免把各模块里的 __main__ 调试块误当测试收集
testpaths = tests

# auto 模式：async def test_* 与 async fixture 自动被识别，不需要手写装饰器
asyncio_mode = auto

# Redis 的异步客户端是全局单例，连接会绑定在"首次使用时"的那个事件循环上。
# 若每个用例各用一个事件循环，复用同一连接会报
# "Event loop is closed" / "attached to a different loop"。
# 因此 fixture 与 test 统一使用 session 级事件循环，全程共用一个。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
